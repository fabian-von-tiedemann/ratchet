name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # The pull request's own checks, on its own data. On a push to main, they run with the job released, and base does not.
  # It runs on the oldest Python the checks support and on the newest, and the job checks needs both legs.
  own:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.x"]
    env:
      # No bytecode next to the checks: unittest imports them before their own code can say so (#100).
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          check-latest: ${{ matrix.python == '3.x' }}
      - name: Generated text matches the data files
        run: python3 maintain/generate.py --check
      - name: This repo's own register has not drifted
        run: python3 checks/check_register.py register.json --markdown REGISTER.md
      - name: Released text is as it stood at its tag
        run: python3 maintain/released_text.py
      # The suite step: every check fails on the fixtures it claims to catch, and every expected test ran and passed.
      - name: Every expected test ran and passed, in a process of its own
        run: python3 checks/expected_tests.py

  # The full suite once more, on a copy of this repo taken through the release steps, with the version dated and
  # tagged. It runs once per pull request and push to main, beside own, and not inside own's suite
  # (D-2026-11-24-faster-suite). See maintain/README.md, "released_text.py".
  released:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The full suite passes on a released copy of this repo
        run: python3 checks/test_released_text.py --released-copy

  # The base branch's checks judge the pull request: maintain/from_base.py, taken from the base commit, never from the
  # pull request. See maintain/README.md, "from_base.py".
  base:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The base branch's checks pass the pull request's data and its checks
        run: |
          judge="$(mktemp -d "$RUNNER_TEMP/from-base.XXXXXX")"
          if ! git cat-file -e "HEAD^1:maintain/from_base.py"; then
            echo "The base, HEAD^1, has no maintain/from_base.py, so the base branch's checks cannot judge this pull request."
            echo "So it is for the pull request that adds it. The maintainer reads it and merges it as an administrator."
            exit 1
          fi
          git show "HEAD^1:maintain/from_base.py" > "$judge/from_base.py"
          python3 -I "$judge/from_base.py" --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA"

  # The status that the ruleset on main requires. It passes only when the pull request's own checks and the suite on a
  # released copy passed and, on a pull request, the base branch's checks too. It runs whatever they did, so that it is
  # never skipped.
  checks:
    needs: [own, base, released]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      OWN: ${{ needs.own.result }}
      BASE: ${{ needs.base.result }}
      RELEASED: ${{ needs.released.result }}
      EVENT: ${{ github.event_name }}
    steps:
      - name: The pull request's own checks, the suite on a released copy and the base branch's checks passed
        run: |
          echo "own: $OWN, base: $BASE, released: $RELEASED, event: $EVENT"
          if [ "$OWN" != success ]; then
            echo "The pull request's own checks, the job own, did not pass."
            exit 1
          fi
          if [ "$RELEASED" != success ]; then
            echo "The full suite on a released copy of this repo, the job released, did not pass."
            exit 1
          fi
          if [ "$EVENT" = pull_request ] && [ "$BASE" != success ]; then
            echo "The base branch's checks, the job base, did not pass this pull request. Its log says why."
            exit 1
          fi
          if [ "$EVENT" != pull_request ] && [ "$BASE" != skipped ]; then
            echo "The job base ran on a $EVENT, where it is not to run."
            exit 1
          fi
