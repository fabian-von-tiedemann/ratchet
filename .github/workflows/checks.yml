name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # No bytecode next to the checks: unittest imports them before their own code can say so (#100).
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Generated text matches the data files
        run: python3 checks/generate.py --check
      - name: This repo's own register has not drifted
        run: python3 checks/check_register.py register.json --markdown REGISTER.md
      - name: Every check fails on the fixtures it claims to catch
        run: python3 -m unittest discover -s checks -v
      - name: Released text is as it stood at its tag
        run: python3 checks/released_text.py
      - name: Every expected test ran and passed, in a process of its own
        run: python3 checks/expected_tests.py
