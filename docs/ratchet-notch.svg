</g>
</g>
<circle class="pivot" cx="170" cy="172" r="15.6"/>
<circle class="dot n0" cx="170.0" cy="53.0" r="3.2"/>
<circle class="dot n1" cx="234.3" cy="71.9" r="3.2"/>
<circle class="dot n2" cx="278.2" cy="122.6" r="3.2"/>
<circle class="dot n3" cx="287.8" cy="188.9" r="3.2"/>
<circle class="dot n4" cx="259.9" cy="249.9" r="3.2"/>
<circle class="dot n5" cx="203.5" cy="286.2" r="3.2"/>
<circle class="dot n6" cx="136.5" cy="286.2" r="3.2"/>
<circle class="dot n7" cx="80.1" cy="249.9" r="3.2"/>
<circle class="dot n8" cx="52.2" cy="188.9" r="3.2"/>
<circle class="dot n9" cx="61.8" cy="122.6" r="3.2"/>
<circle class="dot n10" cx="105.7" cy="71.9" r="3.2"/>
<text class="tooth n0" x="170.0" y="37.5" text-anchor="middle">1</text>
<text class="tooth n1" x="245.7" y="59.7" text-anchor="middle">2</text>
<text class="tooth n2" x="297.3" y="119.3" text-anchor="middle">3</text>
<text class="tooth n3" x="308.6" y="197.4" text-anchor="middle">4</text>
<text class="tooth n4" x="275.8" y="269.2" text-anchor="middle">5</text>
<text class="tooth n5" x="209.4" y="311.8" text-anchor="middle">6</text>
<text class="tooth n6" x="130.6" y="311.8" text-anchor="middle">7</text>
<text class="tooth n7" x="64.2" y="269.2" text-anchor="middle">8</text>
<text class="tooth n8" x="31.4" y="197.4" text-anchor="middle">9</text>
<text class="tooth n9" x="42.7" y="119.3" text-anchor="middle">10</text>
<text class="tooth n10" x="94.3" y="59.7" text-anchor="middle">11</text>
<text class="note" x="14" y="26">one notch tighter</text>
<text class="note" x="326" y="330" text-anchor="end">can’t slip back</text>
</svg>
