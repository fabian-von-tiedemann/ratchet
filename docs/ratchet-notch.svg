<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 344" width="340" height="344" role="img" aria-label="A ratchet wheel with 11 notches, numbered 1 to 11, one for each principle. A pawl clicks from notch to notch, one at a time and never back, one notch tighter with each failure that becomes a check.">
<style>
:root {
  --fg: #15140f;
  --muted: #56524a;
  --box: #fbf9f3;
  --edge: #cfc8b5;
  --signal: #f26a1b;
  --ink: #15140f;
}
@media (prefers-color-scheme: dark) {
  :root {
    --fg: #edeadf;
    --muted: #a6a192;
    --box: #1a1813;
    --edge: #37342a;
    --signal: #ff9648;
    --ink: #15140f;
  }
}
text {
  font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  font-size: 16px;
}
.panel { fill: var(--box); stroke: var(--edge); }
.dial { fill: var(--signal); stroke: var(--fg); stroke-width: 2; stroke-linejoin: round; }
.ring { fill: none; stroke: var(--ink); stroke-width: 1.5; }
.pawl { fill: var(--ink); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
.pivot { fill: var(--box); stroke: var(--ink); stroke-width: 2; }
.dot { fill: var(--edge); }
.tooth { fill: var(--muted); font-weight: 400; }
.dot.n0 { fill: var(--signal); }
.tooth.n0 { fill: var(--fg); font-weight: 700; }
.note { fill: var(--muted); font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 15px; }
.step, .tick { transform-origin: 170px 172px; }
@media (prefers-reduced-motion: no-preference) {
  .step { animation: step 15.4s step-end infinite; }
  .tick { animation: tick 1.4s linear infinite; }
  .tooth { animation: lit 15.4s step-end infinite; }
  .dot { animation: dot 15.4s step-end infinite; }
  .n0 { animation-delay: -0.154s; }
  .n1 { animation-delay: -14.154s; }
  .n2 { animation-delay: -12.754s; }
  .n3 { animation-delay: -11.354s; }
  .n4 { animation-delay: -9.954s; }
  .n5 { animation-delay: -8.554s; }
  .n6 { animation-delay: -7.154s; }
  .n7 { animation-delay: -5.754s; }
  .n8 { animation-delay: -4.354s; }
  .n9 { animation-delay: -2.954s; }
  .n10 { animation-delay: -1.554s; }
}
@keyframes step {
  0.0000% { rotate: 0.000deg; }
  9.0909% { rotate: 32.727deg; }
  18.1818% { rotate: 65.455deg; }
  27.2727% { rotate: 98.182deg; }
  36.3636% { rotate: 130.909deg; }
  45.4545% { rotate: 163.636deg; }
  54.5455% { rotate: 196.364deg; }
  63.6364% { rotate: 229.091deg; }
  72.7273% { rotate: 261.818deg; }
  81.8182% { rotate: 294.545deg; }
  90.9091% { rotate: 327.273deg; }
}
@keyframes tick {
  0%, 80% { rotate: 0deg; }
  86.5% { rotate: 36.000deg; }
  89%, 100% { rotate: 32.727deg; }
}
@keyframes lit {
  0% { fill: var(--fg); font-weight: 700; }
  9.0909% { fill: var(--muted); font-weight: 400; }
}
@keyframes dot {
  0% { fill: var(--signal); }
  9.0909% { fill: var(--edge); }
}
</style>
<rect class="panel" x="0.5" y="0.5" width="339" height="343" rx="8"/>
<path class="dial" d="M170.0 68.0 A104 104 0 0 1 213.5 77.5 L218.9 95.9 L226.2 84.5 A104 104 0 0 1 257.7 116.1 L252.3 134.4 L264.6 128.8 A104 104 0 0 1 274.0 172.3 L259.6 184.9 L272.9 186.8 A104 104 0 0 1 257.3 228.5 L238.4 231.3 L248.6 240.1 A104 104 0 0 1 212.9 266.7 L195.5 258.8 L199.3 271.8 A104 104 0 0 1 154.9 274.9 L144.5 258.8 L140.7 271.8 A104 104 0 0 1 101.6 250.4 L101.6 231.3 L91.4 240.1 A104 104 0 0 1 70.1 201.0 L80.4 184.9 L67.1 186.8 A104 104 0 0 1 70.3 142.4 L87.7 134.4 L75.4 128.8 A104 104 0 0 1 102.1 93.2 L121.1 95.9 L113.8 84.5 A104 104 0 0 1 155.5 69.0 L170.0 81.5 L170.0 68.0 Z"/>
<circle class="ring" cx="170" cy="172" r="68.6"/>
<g class="step">
<g class="tick">
