<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 344" width="340" height="344" role="img" aria-label="A ratchet wheel with 11 teeth, numbered 1 to 11, one for each principle. The wheel turns one tooth at a time. A pawl beside it rides up each tooth and drops behind it with a click. When the wheel tries to roll back, the pawl holds it, one notch tighter with each failure that becomes a check.">
<style>
:root {
  --fg: #15140f;
  --muted: #56524a;
  --box: #fbf9f3;
  --edge: #cfc8b5;
  --signal: #f26a1b;
  --ink: #15140f;
}
@media (prefers-color-scheme: dark) {
  :root {
    --fg: #edeadf;
    --muted: #a6a192;
    --box: #1a1813;
    --edge: #37342a;
    --signal: #ff9648;
    --ink: #15140f;
  }
}
text {
  font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  font-size: 16px;
}
.panel { fill: var(--box); stroke: var(--edge); }
.dial { fill: var(--signal); stroke: var(--fg); stroke-width: 2; stroke-linejoin: round; }
.ring { fill: none; stroke: var(--ink); stroke-width: 1.5; }
.hub { fill: var(--box); stroke: var(--ink); stroke-width: 2; }
.pawl { fill: var(--fg); stroke: var(--fg); stroke-width: 2; stroke-linejoin: round; }
.pivot { fill: var(--box); stroke: var(--fg); stroke-width: 3; }
.dot { fill: none; stroke: var(--signal); stroke-width: 2; }
.tooth { fill: var(--ink); font-weight: 400; }
.dot.n0 { stroke: var(--ink); }
.tooth.n0 { font-weight: 700; }
.note { fill: var(--muted); font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 15px; }
.step, .tick { transform-origin: 170px 196px; }
.lift { transform-origin: 164.3px 33.1px; }
.o0 { transform-origin: 227.5px 156.0px; }
.o1 { transform-origin: 196.7px 131.3px; }
.o2 { transform-origin: 157.5px 127.1px; }
.o3 { transform-origin: 122.2px 144.8px; }
.o4 { transform-origin: 102.2px 178.8px; }
.o5 { transform-origin: 103.6px 218.2px; }
.o6 { transform-origin: 126.1px 250.6px; }
.o7 { transform-origin: 162.6px 265.6px; }
.o8 { transform-origin: 201.4px 258.6px; }
.o9 { transform-origin: 230.2px 231.7px; }
.o10 { transform-origin: 240.0px 193.4px; }
@media (prefers-reduced-motion: no-preference) {
  .step { animation: step 22.0s step-end infinite; }
  .tick { animation: tick 2.0s linear infinite; }
  .unstep { animation: unstep 22.0s step-end infinite; }
  .untick { animation: untick 2.0s linear infinite; }
  .lift { animation: lift 2.0s linear infinite; }
  .tooth { animation: lit 22.0s step-end infinite; }
  .dot { animation: dot 22.0s step-end infinite; }
  .n0 { animation-delay: -0.720s; }
  .n1 { animation-delay: -20.720s; }
  .n2 { animation-delay: -18.720s; }
  .n3 { animation-delay: -16.720s; }
  .n4 { animation-delay: -14.720s; }
  .n5 { animation-delay: -12.720s; }
  .n6 { animation-delay: -10.720s; }
  .n7 { animation-delay: -8.720s; }
  .n8 { animation-delay: -6.720s; }
  .n9 { animation-delay: -4.720s; }
  .n10 { animation-delay: -2.720s; }
}
@keyframes step {
  0.0000% { rotate: 0.000deg; }
  9.0909% { rotate: 32.727deg; }
  18.1818% { rotate: 65.455deg; }
  27.2727% { rotate: 98.182deg; }
  36.3636% { rotate: 130.909deg; }
  45.4545% { rotate: 163.636deg; }
  54.5455% { rotate: 196.364deg; }
  63.6364% { rotate: 229.091deg; }
  72.7273% { rotate: 261.818deg; }
  81.8182% { rotate: 294.545deg; }
  90.9091% { rotate: 327.273deg; }
}
@keyframes unstep {
  0.0000% { rotate: -0.000deg; }
  9.0909% { rotate: -32.727deg; }
  18.1818% { rotate: -65.455deg; }
  27.2727% { rotate: -98.182deg; }
  36.3636% { rotate: -130.909deg; }
  45.4545% { rotate: -163.636deg; }
  54.5455% { rotate: -196.364deg; }
  63.6364% { rotate: -229.091deg; }
  72.7273% { rotate: -261.818deg; }
  81.8182% { rotate: -294.545deg; }
  90.9091% { rotate: -327.273deg; }
}
@keyframes tick {
  0%, 14% { rotate: 0.000deg; }
  26% { rotate: 5.891deg; }
  50% { rotate: 20.291deg; }
  62% { rotate: 32.727deg; }
  68% { rotate: 39.727deg; }
  74% { rotate: 39.727deg; }
  84% { rotate: 32.727deg; }
  87% { rotate: 33.627deg; }
  90%, 100% { rotate: 32.727deg; }
}
@keyframes untick {
  0%, 14% { rotate: 0.000deg; }
  26% { rotate: -5.891deg; }
  50% { rotate: -20.291deg; }
  62% { rotate: -32.727deg; }
  68% { rotate: -39.727deg; }
  74% { rotate: -39.727deg; }
  84% { rotate: -32.727deg; }
  87% { rotate: -33.627deg; }
  90%, 100% { rotate: -32.727deg; }
}
@keyframes lift {
  0%, 14% { rotate: 0.000deg; }
  26% { rotate: -2.400deg; }
  50% { rotate: -7.680deg; }
  62% { rotate: -12.000deg; }
  64% { rotate: -12.000deg; }
  67% { rotate: 0.000deg; }
  69% { rotate: -1.200deg; }
  71%, 100% { rotate: 0.000deg; }
}
@keyframes lit {
  0% { font-weight: 700; }
  9.0909% { font-weight: 400; }
}
@keyframes dot {
  0% { stroke: var(--ink); }
  9.0909% { stroke: var(--signal); }
}
</style>
