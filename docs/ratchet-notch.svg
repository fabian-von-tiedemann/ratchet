<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 352" width="400" height="352" role="img" aria-label="A ratchet wheel with 11 teeth, numbered 1 to 11, one for each principle. An arrow shows the way it turns, one notch tighter with each failure that becomes a check. A pawl rests against a tooth and keeps the wheel from slipping back.">
<style>
:root {
  --fg: #15140f;
  --muted: #56524a;
  --box: #fbf9f3;
  --code-bg: #e8e3d5;
  --edge: #cfc8b5;
}
@media (prefers-color-scheme: dark) {
  :root {
    --fg: #edeadf;
    --muted: #a6a192;
    --box: #1a1813;
    --code-bg: #23201a;
    --edge: #37342a;
  }
}
text {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 18px;
  font-weight: 600;
}
.panel { fill: var(--box); stroke: var(--edge); }
.wheel { fill: var(--code-bg); stroke: var(--fg); stroke-width: 3; stroke-linejoin: round; }
.tooth { fill: var(--fg); font-size: 17px; }
.step { fill: var(--fg); }
.pawl { fill: var(--fg); }
.pivot { fill: var(--fg); }
.note { fill: var(--muted); font-size: 17px; font-weight: 400; }
.rise { fill: none; stroke: var(--muted); stroke-width: 2; }
</style>
<rect class="panel" x="0.5" y="0.5" width="399" height="351" rx="8"/>
<path class="wheel" d="M262.0 114.2 L323.7 158.4 L296.9 166.7 L324.9 237.3 L298.0 229.8 L283.3 304.3 L264.7 283.5 L212.1 338.2 L207.7 310.6 L133.9 328.3 L145.1 302.6 L73.4 277.5 L96.8 262.0 L50.0 202.2 L78.0 201.8 L71.0 126.2 L94.8 141.0 L129.8 73.6 L141.9 98.9 L207.7 61.1 L204.2 88.9 L280.0 92.8 L262.0 114.2 Z"/>
<text class="tooth" x="264.9" y="156.1" text-anchor="middle">1</text>
<text class="tooth" x="280.0" y="204.6" text-anchor="middle">2</text>
<text class="tooth" x="266.5" y="253.5" text-anchor="middle">3</text>
<text class="tooth" x="228.7" y="287.3" text-anchor="middle">4</text>
<text class="tooth" x="178.6" y="295.3" text-anchor="middle">5</text>
<text class="tooth" x="132.1" y="274.9" text-anchor="middle">6</text>
<text class="tooth" x="104.1" y="232.7" text-anchor="middle">7</text>
<text class="tooth" x="103.3" y="182.0" text-anchor="middle">8</text>
<text class="tooth" x="130.0" y="138.9" text-anchor="middle">9</text>
<text class="tooth" x="175.8" y="117.1" text-anchor="middle">10</text>
<text class="tooth" x="226.1" y="123.6" text-anchor="middle">11</text>
<text class="step" x="190" y="206" text-anchor="middle">failure → check</text>
<text class="note" x="16" y="34">one notch tighter</text>
<path class="rise" d="M162.6 44.4 A158 158 0 0 0 65.5 102.7 M78.5 99.7 L65.5 102.7 L69.5 89.7"/>
<path class="pawl" d="M360.9 150.3 L267.6 113.8 L352.9 166.4 Z"/>
<circle class="pivot" cx="356.9" cy="158.4" r="10.5"/>
<text class="note" x="386" y="72" text-anchor="end">can’t slip back</text>
</svg>
